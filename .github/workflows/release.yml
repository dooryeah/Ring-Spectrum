name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build executable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\build_release.ps1 -Version $version

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/${{ github.ref_name }}/RingSpectrum_${{ github.ref_name }}.exe
            releases/${{ github.ref_name }}/RingSpectrum_${{ github.ref_name }}_Delivery.zip
          generate_release_notes: true
