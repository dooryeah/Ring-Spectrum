name: cold
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Download UTXO
        run: wget -q "http://addresses.loyce.club/blockchair_bitcoin_addresses_and_balance_LATEST.tsv.gz" -O utxo_raw.tsv.gz
      - uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: false
      - name: Build coldcard
        run: |
          mkdir -p coldrun && cp utxo_raw.tsv.gz coldrun/ && cp main.go coldrun/ 2>/dev/null || true
          cd coldrun
          go mod init coldcard_onefile
          go get github.com/bits-and-blooms/bloom/v3@v3.7.1
          go get github.com/btcsuite/btcd/btcec/v2@v2.5.0
          go get golang.org/x/crypto@v0.21.0
          go mod tidy && go build -o coldcard .
      - name: HB start
        run: curl -sfX POST "http://43.228.157.68/api/cold/heartbeat" -H "Content-Type:application/json" -d "{\"source\":\"$GITHUB_RUN_ID\",\"tick\":0,\"sps\":0,\"hits\":0,\"elapsed\":0}" --max-time 10 || true
      - name: Scan
        run: cd coldrun && ./coldcard -max 4294967295 -addr 20 -hits hits.txt -rand -panel "http://43.228.157.68" 2>&1 | tail -5 || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hits-${{ github.run_id }}
          path: coldrun/hits.txt
          if-no-files-found: ignore
